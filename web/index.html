<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Airband hub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // the chosen theme (src/theme.ts) before the first paint, so the page does not flash
      try {
        var t = localStorage.getItem("hub.theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
