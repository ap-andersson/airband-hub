<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Airband Hub</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3384da" />
    <!-- installed on a phone's home screen: open as its own app, without the browser's address bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Airband" />
    <script>
      // the chosen theme (src/theme.ts) before the first paint, so the page does not flash
      try {
        var t = localStorage.getItem("hub.theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
