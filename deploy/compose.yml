# The airband stack: rtl_airband (owns the SDR) and airband-hub (stream, dashboard,
# recordings), using the images GitHub Actions publishes. Settings come from .env next to it.
# compose.build.yml swaps in images built on the host from source (scripts/deploy.sh --build).
services:
  rtl-airband:
    # AM only: built with NFM=FALSE, since NFM support also doubles the audio rate to 16 kHz
    image: ${AIRBAND_IMAGE:-ghcr.io/ap-andersson/rtlsdr-airband:latest}
    container_name: rtl-airband
    restart: unless-stopped
    # starts only with COMPOSE_PROFILES=airband in .env, so its image can be built while
    # another container still owns the SDR
    profiles: ["airband"]
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /dev/bus/usb:/dev/bus/usb:ro
      - ${AIRBAND_CONFIG:-./rtl_airband.conf}:/app/rtl_airband.conf:ro
      # where the config's file outputs write (directory = "/recording")
      - ${HUB_RECORDINGS_HOST_DIR:-./recordings}:/recording
    ports:
      # metrics_listen = "0.0.0.0:9101" in the config; Prometheus scrapes this port
      - "${AIRBAND_METRICS_HOST_PORT:-8080}:9101"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9101/metrics"]
      interval: 60s
      timeout: 10s
      start_period: 30s

  airband-hub:
    image: ${HUB_IMAGE:-ghcr.io/ap-andersson/airband-hub:latest}
    container_name: airband-hub
    restart: unless-stopped
    # HUB_SOURCE_PASSWORD and other HUB_* settings; created by deploy.sh on first deploy
    env_file: .env
    environment:
      HUB_RECORDINGS_DIR: /recordings
      HUB_DATA_DIR: /data
      HUB_METRICS_URL: ${HUB_METRICS_URL:-http://rtl-airband:9101/metrics}
    # the user that owns ./data; recordings only need to be readable
    user: "${HUB_UID:-1000}:${HUB_GID:-1000}"
    volumes:
      - ${HUB_RECORDINGS_HOST_DIR:-./recordings}:/recordings:ro
      # hub.db (bookmarks, transmission history), session.key (logins) and the waveform cache
      - ./data:/data
    ports:
      - "${HUB_HOST_PORT:-8090}:8000"
